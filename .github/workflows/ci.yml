name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result; a failure on one Node is worth seeing
      # alongside the others rather than cancelling them.
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # typecheck covers tests/ via tsconfig.test.json; build does not.
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # The divergence eval is only trustworthy if the extractor is deterministic
  # and the corpus aliases stay disjoint. Both are asserted by tests, but
  # running the suite twice catches accidental order- or state-dependence that
  # a single pass would hide.
  eval-determinism:
    name: Eval harness determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run the suite twice and compare summaries
        run: |
          npm test 2>&1 | grep -E '^# (tests|pass|fail)' > run1.txt
          npm test 2>&1 | grep -E '^# (tests|pass|fail)' > run2.txt
          diff run1.txt run2.txt
          cat run1.txt
