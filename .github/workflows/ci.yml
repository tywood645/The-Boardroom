name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result; a failure on one Node is worth seeing
      # alongside the others rather than cancelling them.
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # typecheck covers tests/ via tsconfig.test.json; build does not.
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
